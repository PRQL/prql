label: Top N by group
prql: |
  # Employee who joined first in each role
  # Quite difficult in SQL...
  from employees
  group role (
    sort join_date
    take 1
  )
sql: |
  WITH
  table_0 AS (
    SELECT
      *,
      ROW_NUMBER() OVER (
        PARTITION BY
          role
        ORDER BY
          join_date
      ) AS _expr_0
    FROM
      employees
  )
  SELECT
    *
  FROM
    table_0
  WHERE
    _expr_0 <= 1
