bot_name: prql-bot
secrets:
  # Docker Hub login is needed by test-rust.yaml on internal PRs (external-DB
  # tests); it's a low-value pull token, so it's intentionally repo-level.
  # Everything else sits behind an environment, split by the ref that releases
  # it: `tend` for the jobs that run on `main`, `release` for the ones that run
  # on a tag.
  allowed:
    - DOCKERHUB_TOKEN
    - DOCKERHUB_USERNAME
setup:
  - uses: ./.github/actions/tend-setup
  - uses: baptiste0928/cargo-install@v3
    with:
      crate: cargo-llvm-cov
  # Tend shares the runner checkout, home, and PATH with the agent. Install
  # test and lint tools here, after tend-setup has put uv on PATH.
  # `cargo --version` installs the pinned rust-toolchain.toml toolchain once;
  # otherwise parallel `cargo fmt` hooks race to install it during lint.
  - run: |-
      mkdir -p ~/.local/bin
      curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.local/bin
      cargo-nextest --version
      curl -LsSf https://github.com/mitsuhiko/insta/releases/latest/download/cargo-insta-installer.sh | CARGO_HOME=~/.local sh
      cargo-insta --version
      uv tool install pre-commit
      pre-commit --version
      cargo --version
      cargo llvm-cov --version
    shell: bash
workflows:
  ci-fix:
    watched_workflows:
      - tests
