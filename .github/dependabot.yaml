version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      # Running daily means the GHA cache will be cycling much faster, and we're
      # not in a great rush. So trying weekly, and we can iterate.
      interval: weekly
    commit-message:
      prefix: "chore: "
    groups:
      # `pyo3-build-config` is PyO3's own build-script helper and is released in
      # lockstep with `pyo3`; PyO3 expects the two to be on the same version.
      # Ungrouped, Dependabot raises a separate PR for each, and merging one
      # without the other leaves the versions split — #6258 took
      # `pyo3-build-config` to 0.29.2 while `pyo3` stayed on 0.27, which put two
      # copies of the crate in the lockfile. Listed before `patch` because a
      # dependency joins the first group it matches.
      pyo3:
        patterns:
          - "pyo3"
          - "pyo3-build-config"
      # Bump all patch versions of rust dependencies as a single PR
      patch:
        update-types:
          - patch
    # We exclude labels throughout because of https://github.com/dependabot/dependabot-core/issues/7645#issuecomment-1986212847
    labels: []

  - package-ecosystem: "npm"
    directories:
      - "/prqlc/bindings/js"
      - "/web/playground"
    schedule:
      interval: daily
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
    commit-message:
      prefix: "chore: "
    labels: []

  - package-ecosystem: docker
    directory: .devcontainer/base-image
    schedule:
      interval: daily
    commit-message:
      prefix: "chore: "
    labels: []

  - package-ecosystem: "github-actions"
    # `/` only covers `.github/workflows/`; each composite action under
    # `.github/actions/` needs its own entry or its `uses:` refs are never
    # scanned. Keep this list in sync with `ls .github/actions/`.
    directories:
      - "/"
      - ".github/actions/build-js"
      - ".github/actions/build-prqlc"
      - ".github/actions/build-prqlc-c"
      - ".github/actions/build-python"
      - ".github/actions/tend-setup"
      - ".github/actions/time-compilation"
    commit-message:
      prefix: "chore: "
    schedule:
      interval: daily
    ignore:
      # tend's own action is updated by the nightly `tend/update-workflows`
      # regen (`uvx tend init`), which follows structural changes a version-only
      # Dependabot bump can't — e.g. the 0.1.7 move that split the action into
      # `claude/` / `codex/` subdirectories, leaving the bare `max-sixty/tend@0.1.7`
      # ref with no `action.yaml` and breaking every workflow (see #6031).
      # Excluding it here avoids redundant (and sometimes broken) duplicate PRs.
      - dependency-name: "max-sixty/tend"
    labels: []

  - package-ecosystem: uv
    directory: "prqlc/bindings/prqlc-python"
    schedule:
      interval: daily
    commit-message:
      prefix: "chore: "
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
    labels: []

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: daily
    labels: []

  - package-ecosystem: "mix"
    directory: "prqlc/bindings/elixir"
    schedule:
      interval: daily
    commit-message:
      prefix: "chore: "
    labels: []
