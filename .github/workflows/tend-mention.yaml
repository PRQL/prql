#
# Do not edit this file directly — it will be overwritten on regeneration.
# To change this workflow, edit .config/tend.yaml. To change what the agent
# does, edit the relevant skill (for example, `running-tend`) in this repo's
# .claude/skills/ directory, or open an issue at
# https://github.com/max-sixty/tend/issues for changes that need to
# happen upstream in the tend-ci-runner plugin.

name: tend-mention
# A relayed review's run would otherwise be named for its event type. Named
# for the PR, like every other run, the notifications poll can see it holds
# that PR.
run-name: ${{ github.event.client_payload.title || github.event.issue.title }}
on:
  issues:
    types: [edited]
  issue_comment:
    types: [created, edited]
  # Review events arrive re-posted by tend-mention-relay. GitHub creates this
  # run even though a `GITHUB_TOKEN` triggered it — `workflow_dispatch` and
  # `repository_dispatch` are the two events exempt from the rule that
  # token-triggered events start no workflow — and it carries the default
  # branch, which the environment admits.
  repository_dispatch:
    types: [tend-mention-review]

jobs:
  verify:
    # The check step rejects the bot's own comments before handle starts,
    # including health-report comments from a failed preflight. Human replies
    # on those same issues still go through engagement verification.
    if: |
      vars.TEND_ENABLED != 'false' && (
        github.event_name == 'repository_dispatch' ||
        (github.event_name == 'issues' &&
          contains(github.event.issue.body, '@prql-bot')) ||
        github.event_name == 'issue_comment')
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      reason: ${{ steps.check.outputs.reason }}
      url: ${{ steps.check.outputs.url }}
      ts: ${{ steps.check.outputs.ts }}
    steps:
      - uses: max-sixty/tend/setup-runtime@0.3.22
      - name: Verify bot engagement
        id: check
        run: |
          tend runtime mention-verify
        env:
          GITHUB_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}
          BOT_NAME: prql-bot
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_TYPE: ${{ github.event.comment.user.type }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_OR_PR_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          PAYLOAD_KIND: ${{ github.event.client_payload.kind }}
          PAYLOAD_PR: ${{ github.event.client_payload.pr }}
          PAYLOAD_ID: ${{ github.event.client_payload.id }}

  handle:
    needs: verify
    if: needs.verify.outputs.should_run == 'true'
    concurrency:
      group: ${{ github.workflow }}-handle-${{ github.event.issue.number || github.event.client_payload.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    steps:
      - name: Record job start
        run: echo "TEND_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: max-sixty/tend/setup-runtime@0.3.22
      # Both halves of the reaction belong to this job, so the eyes can only
      # go on once the job that takes them off has started. Put them in
      # `verify` and `handle` respectively and the routine burst case strands
      # them: a third mention on one thread evicts the second's pending
      # `handle` — a job cancelled while queued allocates no runner and runs
      # no steps, `always()` included — while its `verify` already reacted.
      #
      # The dispatch arm covers a relayed inline comment, whose id the check
      # step verified belongs to this PR; a review *submission* has no single
      # comment to react to, so it gets no eyes. The job's own `if` already
      # carries `should_run`.
      - name: React with eyes
        if: |
          ((github.event.comment && contains(github.event.comment.body, '@prql-bot'))
              || (github.event.client_payload.kind == 'pull_request_review_comment'
                  && needs.verify.outputs.reason == 'mention'))
        run: |
          tend runtime reaction add
        env:
          REPO: ${{ github.repository }}
          TARGET: ${{ github.event_name == 'issue_comment'
            && format('issues/comments/{0}', github.event.comment.id)
            || format('pulls/comments/{0}', github.event.client_payload.id) }}
          GITHUB_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}

      # The first step captured job start, before runtime installation,
      # checkout and consumer setup.
      - name: Compute queue delay
        id: delay
        run: |
          tend runtime queue-delay
        env:
          # A relayed event's timestamp comes from verify, which read it off
          # the API record — the dispatch payload never carries one to spoof.
          EVENT_TS: ${{ github.event.comment.updated_at || needs.verify.outputs.ts || github.event.issue.updated_at }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: ./.github/actions/tend-setup
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-llvm-cov
      - run: |-
          mkdir -p ~/.local/bin
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.local/bin
          cargo-nextest --version
          curl -LsSf https://github.com/mitsuhiko/insta/releases/latest/download/cargo-insta-installer.sh | CARGO_HOME=~/.local sh
          cargo-insta --version
          uv tool install pre-commit
          pre-commit --version
          cargo --version
          cargo llvm-cov --version
        shell: bash

      - uses: max-sixty/tend/claude@0.3.22
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          merge: restricted
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: opus
          checkout_mode: mention
          base_branch: ${{ github.event.repository.default_branch }}
          prompt: >-
            /tend-ci-runner:mention

            ${{ steps.delay.outputs.seconds
            && format('This job started {0}s after the triggering event (over ~40s means it was queued). ',
            steps.delay.outputs.seconds) || '' }}

            ${{ github.event_name == 'issues'
              && format('An issue was updated with a mention of you ({0}).', github.event.issue.html_url)
              || (github.event.client_payload.kind == 'pull_request_review_comment' && needs.verify.outputs.reason == 'mention'
                && format('You were mentioned in an inline review comment on PR #{0} ({1}, comment ID {2}).', github.event.client_payload.pr, needs.verify.outputs.url, github.event.client_payload.id))
              || (github.event.client_payload.kind == 'pull_request_review_comment'
                && format('An inline review comment was posted on a PR where you previously participated (PR #{0}, {1}, comment ID {2}).', github.event.client_payload.pr, needs.verify.outputs.url, github.event.client_payload.id))
              || (github.event.client_payload.kind == 'pull_request_review' && needs.verify.outputs.reason == 'mention'
                && format('A review was submitted on PR #{0} that mentions you ({1}, review ID {2}).', github.event.client_payload.pr, needs.verify.outputs.url, github.event.client_payload.id))
              || (github.event.client_payload.kind == 'pull_request_review'
                && format('A review was submitted on a PR where you previously participated (PR #{0}, {1}, review ID {2}).', github.event.client_payload.pr, needs.verify.outputs.url, github.event.client_payload.id))
              || (contains(github.event.comment.body, '@prql-bot')
                && format('You were mentioned in a comment ({0}).', github.event.comment.html_url))
              || format('A user commented on an issue/PR where you previously participated ({0}).', github.event.comment.html_url)
            }}

      - name: Remove the eyes reaction
        if: |
          always()
          && ((github.event.comment && contains(github.event.comment.body, '@prql-bot'))
              || (github.event.client_payload.kind == 'pull_request_review_comment'
                  && needs.verify.outputs.reason == 'mention'))
        run: |
          tend runtime reaction remove
        env:
          REPO: ${{ github.repository }}
          TARGET: ${{ github.event_name == 'issue_comment'
            && format('issues/comments/{0}', github.event.comment.id)
            || format('pulls/comments/{0}', github.event.client_payload.id) }}
          BOT_NAME: prql-bot
          GITHUB_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}
