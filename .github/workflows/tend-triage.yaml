name: tend-triage
on:
  issues:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.repository_owner == 'PRQL' && contains(github.event.issue.labels.*.name, 'tend-outage') == false && contains(github.event.issue.labels.*.name, 'tend-rate-limit') == false
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    steps:
      - name: React with eyes
        run: |
          gh api "repos/$REPO/$TARGET/reactions" -f content=eyes --silent \
            || echo "::warning::could not add the eyes reaction"
        env:
          REPO: ${{ github.repository }}
          TARGET: issues/${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: ./.github/actions/tend-setup

      - uses: max-sixty/tend/claude@0.1.22
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bot_name: prql-bot
          model: opus
          prompt: |
            /tend-ci-runner:triage ${{ github.event.issue.number }}

      - name: Remove the eyes reaction
        if: always()
        run: |
          REACTION_ID=$(gh api --paginate \
            "repos/$REPO/$TARGET/reactions?content=eyes&per_page=100" \
            --jq ".[] | select(.user.login == \"$BOT_NAME\") | .id" | head -n1)
          if [ -n "$REACTION_ID" ]; then
            gh api -X DELETE "repos/$REPO/$TARGET/reactions/$REACTION_ID" --silent \
              || echo "::warning::could not remove the eyes reaction"
          fi
        env:
          REPO: ${{ github.repository }}
          TARGET: issues/${{ github.event.issue.number }}
          BOT_NAME: prql-bot
          GITHUB_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}
