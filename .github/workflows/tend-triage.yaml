name: tend-triage
on:
  issues:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.repository_owner == 'PRQL' && vars.TEND_ENABLED != 'false' && contains(github.event.issue.labels.*.name, 'tend-outage') == false && contains(github.event.issue.labels.*.name, 'tend-rate-limit') == false
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    steps:
      - name: React with eyes
        run: |
          gh api "repos/$REPO/$TARGET/reactions" -f content=eyes --silent \
            || echo "::warning::could not add the eyes reaction"
        env:
          REPO: ${{ github.repository }}
          TARGET: issues/${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: ./.github/actions/tend-setup
      - run: |-
          mkdir -p ~/.local/bin
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.local/bin
          cargo-nextest --version
          curl -LsSf https://github.com/mitsuhiko/insta/releases/latest/download/cargo-insta-installer.sh | CARGO_HOME=~/.local sh
          cargo-insta --version
          uv tool install pre-commit
          pre-commit --version
          cargo --version
        shell: bash

      - uses: max-sixty/tend/codex@0.3.1
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          merge: maintainer
          control_plane_owner: ""
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          codex_auth_json: ${{ secrets.CODEX_AUTH_JSON }}
          bot_name: prql-bot
          model: gpt-6-sol
          checkout_mode: base
          base_branch: ${{ github.event.repository.default_branch }}
          prompt: |2
            $triage ${{ github.event.issue.number }}

      - name: Remove the eyes reaction
        if: always()
        run: |
          REACTION_ID=$(gh api --paginate \
            "repos/$REPO/$TARGET/reactions?content=eyes&per_page=100" \
            --jq ".[] | select(.user.login == \"$BOT_NAME\") | .id" | head -n1)
          if [ -n "$REACTION_ID" ]; then
            gh api -X DELETE "repos/$REPO/$TARGET/reactions/$REACTION_ID" --silent \
              || echo "::warning::could not remove the eyes reaction"
          fi
        env:
          REPO: ${{ github.repository }}
          TARGET: issues/${{ github.event.issue.number }}
          BOT_NAME: prql-bot
          GITHUB_TOKEN: ${{ secrets.TEND_BOT_TOKEN }}
