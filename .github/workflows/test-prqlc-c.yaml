name: test-prqlc-c

on:
  workflow_call:
  workflow_dispatch:

# We need consistent env vars across all workflows for the cache to work
env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: 1
  RUSTFLAGS: "-C debuginfo=0"
  RUSTDOCFLAGS: "-Dwarnings"

jobs:
  test-c:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ./.github/workflows/scripts/set_version.sh
      - name: 💰 Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ env.version }}-${{ hashFiles('./Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: lib
          # Caching `~/.cargo/bin/` breaks the rustup `cargo`/`rustc` symlinks
          # on the new macos-15 runner image — see
          # https://github.com/Swatinem/rust-cache/issues/341.
          cache-bin: "false"
      - name: Build
        uses: clechasseur/rs-cargo@2a8aa939121c79dd2b4305ed6bf83bc400ce1036 # v4.0.2
        with:
          command: build
          # Currently requires a release build; would be useful to allow a debug build.
          args: --release --package prqlc-c
      - name: Run example minimal-c
        working-directory: prqlc/bindings/prqlc-c/examples/minimal-c
        run: make run
      - name: Run example minimal-cpp
        working-directory: prqlc/bindings/prqlc-c/examples/minimal-cpp
        run: make run

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.53.1
      - name: 🔧 Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Run example minimal-zig
        run: task zig
