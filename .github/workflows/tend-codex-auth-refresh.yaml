name: tend-codex-auth-refresh
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

# Only this workflow may rotate the refresh-token chain. Consumer jobs share
# the access token concurrently; a second refresher must never race this one.
concurrency:
  group: tend-codex-auth-refresh
  cancel-in-progress: false

jobs:
  subscription:
    if: github.repository_owner == 'PRQL'
    environment:
      name: tend
      deployment: false
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      configured: ${{ steps.presence.outputs.configured }}
    steps:
      - id: presence
        env:
          CONFIGURED: ${{ secrets.CODEX_AUTH_JSON != '' }}
        run: echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
  refresh:
    if: github.repository_owner == 'PRQL'
    environment:
      name: tend-codex-refresh
      deployment: false
    needs: subscription
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: max-sixty/tend/codex/refresh@0.3.13
        with:
          consumer_auth_configured: ${{ needs.subscription.outputs.configured }}
          codex_refresh_auth_json: ${{ secrets.CODEX_REFRESH_AUTH_JSON }}
          refresh_pat: ${{ secrets.CODEX_REFRESH_PAT }}
