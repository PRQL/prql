name: tend-nightly
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  nightly:
    if: github.repository_owner == 'PRQL' && vars.TEND_ENABLED != 'false'
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - uses: ./.github/actions/tend-setup
      - run: |-
          mkdir -p ~/.local/bin
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.local/bin
          cargo-nextest --version
          curl -LsSf https://github.com/mitsuhiko/insta/releases/latest/download/cargo-insta-installer.sh | CARGO_HOME=~/.local sh
          cargo-insta --version
          uv tool install pre-commit
          pre-commit --version
          cargo --version
          mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/NuGet/Migrations"
          touch "${XDG_DATA_HOME:-$HOME/.local/share}/NuGet/Migrations/1"
        shell: bash

      - uses: max-sixty/tend/claude@0.2.15
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bot_name: prql-bot
          model: opus
          checkout_mode: base
          base_branch: ${{ github.event.repository.default_branch }}
          prompt: |2
            /tend-ci-runner:nightly
