name: build-web

on:
  workflow_call:
  workflow_dispatch:

# We need consistent env vars across all workflows for the cache to work
env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: 1
  RUSTFLAGS: "-C debuginfo=0"
  RUSTDOCFLAGS: "-Dwarnings"

jobs:
  build-web:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Website requires Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1

      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: mdbook
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: mdbook-footnote
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: wasm-pack

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - run: ./.github/workflows/scripts/set_version.sh
      - name: 💰 Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: ${{ env.version }}-${{ hashFiles('./Cargo.lock') }}
          shared-key: web
          save-if:
            ${{ github.ref == 'refs/heads/web' || github.ref ==
            'refs/heads/main' }}
          # Caching `~/.cargo/bin/` breaks the rustup `cargo`/`rustc` symlinks
          # on the new macos-15 runner image — see
          # https://github.com/Swatinem/rust-cache/issues/341.
          cache-bin: "false"

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: 3.53.1

      - name: 🕷️ Build web
        run: task web:build

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/website/public/

  build-codemirror-demo:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 🧅 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install CodeMirror demo dependencies
        working-directory: web/prql-codemirror-demo/
        run: bun install
      - name: Install Lezer dependencies
        working-directory: grammars/prql-lezer/
        run: bun install
      - name: Build Lezer grammar
        working-directory: grammars/prql-lezer/
        run: bun run build
      - name: Copy Lezer grammar into demo
        working-directory: web/prql-codemirror-demo/
        run: |
          mkdir src/lang-prql/prql-lezer
          cp ../../grammars/prql-lezer/dist/* src/lang-prql/prql-lezer/
      - name: Build CodeMirror demo
        working-directory: web/prql-codemirror-demo/
        run: bun run build
