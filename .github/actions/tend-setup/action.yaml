name: tend-setup
description:
  Setup steps for tend CI workflows (Rust toolchain, caching, dev tools)

inputs:
  github-token:
    description: GitHub token for API access
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Setup Task
      uses: go-task/setup-task@v1
      with:
        repo-token: ${{ inputs.github-token }}
        version: 3.52.0

    - uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-insta

    - uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-nextest

    # `baptiste0928/cargo-install` installs into `$HOME/.cargo-install/<crate>/bin`
    # and exposes it through `$GITHUB_PATH`, which only affects the runner user.
    # Tend's agent session runs as a separate user (`tend-sandbox`) with its own
    # `$HOME` and its own PATH, so `cargo insta` / `cargo nextest` — the commands
    # CLAUDE.md tells the bot to use — resolve to `no such command` there, and the
    # session either rebuilds both crates from source mid-run or silently falls
    # back to plain `cargo test`. `/usr/local/bin` is shared between the two users
    # and already on the sandbox PATH, so symlinking makes them visible to both.
    #
    # The loop is generic over whatever `cargo-install` produced, so it silently
    # becomes a no-op if that action ever changes its install layout — and a
    # no-op reinstates the exact silent degradation this step exists to remove.
    # The post-check turns that into a red step instead. `-x` follows symlinks,
    # so it covers the missing, dangling, and non-executable cases together.
    - name: Expose cargo-install binaries to the tend sandbox
      run: |
        for bin in "$HOME"/.cargo-install/*/bin/*; do
          [ -x "$bin" ] || continue
          ln -sf "$bin" "/usr/local/bin/$(basename "$bin")"
        done
        for required in cargo-insta cargo-nextest; do
          [ -x "/usr/local/bin/$required" ] ||
            { echo "::error::$required was not exposed to /usr/local/bin"; exit 1; }
        done
      shell: bash

    - run: ./.github/workflows/scripts/set_version.sh
      shell: bash

    - name: Cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ${{ hashFiles('./Cargo.lock') }}
        shared-key: rust-x86_64-unknown-linux-gnu
        save-if: false
        # Caching `~/.cargo/bin/` breaks the rustup `cargo`/`rustc` symlinks
        # on the new macos-15 runner image — see
        # https://github.com/Swatinem/rust-cache/issues/341.
        cache-bin: "false"

    - run: |
        echo CARGO_TERM_COLOR=always >> $GITHUB_ENV
        echo 'RUSTFLAGS=-C debuginfo=0' >> $GITHUB_ENV
        echo 'RUSTDOCFLAGS=-Dwarnings' >> $GITHUB_ENV
      shell: bash
