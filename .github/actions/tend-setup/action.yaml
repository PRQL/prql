name: tend-setup
description: Setup steps for tend CI workflows

inputs:
  github-token:
    description: GitHub token for API access
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # What these steps build reaches the agent. From tend 0.2.14 it works in
    # the job's own checkout and home through a copy-on-write view, with the
    # job's own environment and PATH — so a tool installed here, whether into
    # `/opt/hostedtoolcache` or under the runner's home, is on the agent's
    # PATH, and a `$GITHUB_PATH` or `$GITHUB_ENV` entry any of these actions
    # writes reaches it too. Tools therefore belong in `setup:` in
    # `.config/tend.yaml`, as `uses:` or ordinary `run:` steps, and env vars
    # in those steps' `env:`, exported to `$GITHUB_ENV`.
    #
    # Through 0.2.13 none of that held: the agent worked in a disposable clone
    # with `denyRead` on both the runner's home and the runner's checkout, so
    # only `/opt/hostedtoolcache` crossed over, and tools and env vars had to
    # go in `sandbox_setup:` and `sandbox_env:`. That gap was
    # https://github.com/max-sixty/tend/issues/1198, closed by the move.
    # `.config/tend.yaml` still uses the deprecated `sandbox_setup:` key, which
    # 0.3.1 accepts with a warning and emits as a `run:` step after this
    # composite; migrating those commands into `setup:` is a follow-up.
    - name: Setup Task
      uses: go-task/setup-task@v2
      with:
        repo-token: ${{ inputs.github-token }}
        version: 3.53.1

    # `.config/tend.yaml`'s `uv tool install pre-commit` needs a `uv`. That
    # command runs in an ordinary step after this composite, where tend
    # supplies no `uv` of its own, so this is the only one on PATH.
    #
    # Hence no `UV_NO_MODIFY_PATH` here, unlike the generated gate jobs in
    # `tend-mention` and `tend-notifications`, which set it and then call the
    # action's `uv-path` output by absolute path. That variable suppresses
    # every PATH entry `setup-uv` makes, including the one for `uv` itself, so
    # setting it here would leave that later step with no `uv` to run. What it
    # would *not* cost is `~/.local/bin` — where `sandbox_setup:` puts
    # `cargo-nextest`, `cargo-insta` and `pre-commit` — because the
    # ubuntu-24.04 image already has `$HOME/.local/bin` on the job PATH.
    #
    # The cache stays off because the runner does no `uv` work worth caching.
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: false
