name: tend-setup
description: Setup steps for tend CI workflows

inputs:
  github-token:
    description: GitHub token for API access
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Setup Task
      uses: go-task/setup-task@v2
      with:
        repo-token: ${{ inputs.github-token }}
        version: 3.53.1

    # The following setup steps use uv to install pre-commit. Keep uv on PATH.
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        enable-cache: false
