name: tend-setup
description:
  Setup steps for tend CI workflows (Rust toolchain, caching, dev tools)

inputs:
  github-token:
    description: GitHub token for API access
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Setup Task
      uses: go-task/setup-task@v2
      with:
        repo-token: ${{ inputs.github-token }}
        version: 3.52.0

    - uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-insta

    - uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-nextest

    - run: ./.github/workflows/scripts/set_version.sh
      shell: bash

    - name: Cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ${{ hashFiles('./Cargo.lock') }}
        shared-key: rust-x86_64-unknown-linux-gnu
        save-if: false
        # Caching `~/.cargo/bin/` breaks the rustup `cargo`/`rustc` symlinks
        # on the new macos-15 runner image — see
        # https://github.com/Swatinem/rust-cache/issues/341.
        cache-bin: "false"

    - run: |
        echo CARGO_TERM_COLOR=always >> $GITHUB_ENV
        echo 'RUSTFLAGS=-C debuginfo=0' >> $GITHUB_ENV
        echo 'RUSTDOCFLAGS=-Dwarnings' >> $GITHUB_ENV

        # Expose the `cargo-install` binaries to the tend sandbox.
        # `baptiste0928/cargo-install` installs into
        # `$HOME/.cargo-install/<crate>/bin` and exposes it through
        # `$GITHUB_PATH`, which only affects the runner user. Tend's agent
        # session runs as a separate user (`tend-sandbox`) with its own `$HOME`
        # and its own PATH, so `cargo insta` / `cargo nextest` — the commands
        # CLAUDE.md tells the bot to use — resolve to `no such command` there,
        # and the session either rebuilds both crates from source mid-run or
        # silently falls back to plain `cargo test`. `/usr/local/bin` is shared
        # between the two users and already on the sandbox PATH.
        #
        # The loop is generic over whatever `cargo-install` produced, so it
        # silently becomes a no-op if that action ever changes its install
        # layout — and a no-op reinstates the exact silent degradation this
        # exists to remove. The post-check turns that into a red step instead.
        # `-x` follows symlinks, so it covers the missing, dangling, and
        # non-executable cases together.
        #
        # This shares an existing step rather than adding its own: `tend-review`
        # checks out the base tree, runs this action, then checks out the PR on
        # top, so a PR that changes the step count here makes the runner's
        # post-phase lookup miss and the review job fails with `Index was out of
        # range` (max-sixty/tend#846).
        #
        # tend's own `sandbox_path:` lever prepends directories to the sandbox
        # PATH and names `cargo-nextest` as its motivating case, so it is the
        # supported alternative to this block. Two reasons it lost here. Its
        # `~` expands to the *sandbox* home, so reaching these binaries means
        # hardcoding `/home/runner/.cargo-install/<crate>/bin` per crate; and
        # adopter entries are prepended verbatim without an existence test, so
        # an install-layout change degrades silently — the failure this block's
        # post-check exists to make loud. It would also put a `/home/runner`
        # directory on the sandbox PATH, which tend's PATH derivation otherwise
        # refuses to do (it calls that rewrite "the SOLE credential boundary");
        # symlinking two named binaries into an already-shared `/usr/local/bin`
        # doesn't cross it. Revisit if `sandbox_path:` grows a guard.
        for bin in "$HOME"/.cargo-install/*/bin/*; do
          [ -x "$bin" ] || continue
          ln -sf "$bin" "/usr/local/bin/$(basename "$bin")"
        done
        for required in cargo-insta cargo-nextest; do
          [ -x "/usr/local/bin/$required" ] ||
            { echo "::error::$required was not exposed to /usr/local/bin"; exit 1; }
        done
      shell: bash
